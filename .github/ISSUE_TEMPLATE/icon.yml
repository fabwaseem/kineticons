name: Icon request
description: Ask for a new icon (or a better motion for an existing one)
labels: [icon]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: parachute
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Where you would use it
      description: The interface or idea it stands for, and similar icons you have tried.
    validations:
      required: true
  - type: textarea
    id: motion
    attributes:
      label: How it could move
      placeholder: The canopy fills out and the parachute sways down a little.
