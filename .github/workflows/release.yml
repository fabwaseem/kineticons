name: Release

# Every push to main: if it carries changesets (`pnpm changeset`), they are applied (versions bumped, changelogs
# written) and committed back to main; then every package whose version is not on npm yet is published.
# npm sign-in is trusted publishing (OIDC): each package on npmjs.com trusts this workflow, so no token is stored.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # the version commit this workflow pushes does not need a second run
    if: "!startsWith(github.event.head_commit.message, 'Version packages')"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Apply changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv 'README.md'; then
            pnpm changeset version
            pnpm install --no-frozen-lockfile
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Version packages"
            git push origin HEAD:main
          else
            echo "no changesets"
          fi

      - run: pnpm build
      - run: pnpm lint:packages

      - name: Publish to npm, tag, GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish.mjs

      # JSR (jsr.io) gets @kineticons/core too; a JSR hiccup never blocks an npm release
      - name: Publish core to JSR
        continue-on-error: true
        run: node scripts/publish-jsr.mjs
