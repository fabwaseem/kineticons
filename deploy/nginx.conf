server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # redirects (/icons -> /icons/) keep the visitor's host and scheme, behind Coolify's proxy too
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # hashed build files never change
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /catalog.json {
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
